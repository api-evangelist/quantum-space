aid: quantum-space
name: Quantum Space
description: 'Quantum Space is a space defense and orbital mobility company headquartered
  in Rockville, Maryland, building Ranger — a maneuverable spacecraft designed to operate
  across LEO, MEO, GEO and cislunar orbits. Per the company''s own published material,
  Ranger carries up to 4,000 kg of storable propellant, uses multi-mode chemical and
  electric propulsion for up to 12 km/s of delta-V, is designed for a 15-year on-station
  operational life, supports on-orbit refueling in both directions, and exposes a modular
  five-port payload architecture. The company sells space domain awareness, satellite
  servicing, satellite life extension and on-orbit refueling to national security, civil
  and commercial customers, with engineering in Rockville, propulsion and integration
  in Hawthorne, California and Huntsville, Alabama, and spacecraft production in Tulsa,
  Oklahoma. Leadership includes CEO Jim Bridenstine (former NASA Administrator), Executive
  Chairman Kam Ghaffarian and President Kerry Wisnosky. Quantum Space publishes no public
  developer program, API reference or machine-readable API contract; the only machine-readable
  artifact served from its own hosts is an llms.txt at the website root.'
